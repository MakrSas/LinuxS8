[Unit]
# Ограничиваем петлю перезапусков. У phosh Restart=always с паузой 5 с,
# и при неудаче он мигал бы экраном бесконечно, как это делал gnome-shell.
# Порог поднят с 3: пульт теперь перезапускает оболочку по нажатию
# (смена масштаба, смена композитора), и на трёх попытках подряд
# упирался живой сеанс, а не петля. Эксперимент 30 на этом потерял
# целую фазу. Десяти за три минуты по-прежнему хватает, чтобы отличить
# петлю от опытов.
StartLimitIntervalSec=180
StartLimitBurst=10

[Service]
# Штатные 30 с сюда не годятся: на этом устройстве первый кадр сеанса
# исторически считался долго.
TimeoutStartSec=300

# Композитор systemd запускает мимо PAM, поэтому /etc/environment до него
# не доходит — переменную приходится дублировать здесь. Ровно из-за этого
# расхождения phoc когда-то рисовал на Mali, пока приложения сидели на
# процессоре.
Environment=PAN_MESA_DEBUG=noafbc
